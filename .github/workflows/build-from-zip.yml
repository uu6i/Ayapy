
name: Build AyaPy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip AyaPy-Android-Project-v1.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/AyaPy
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AyaPy-APK
          path: extracted/AyaPy/app/build/outputs/apk/debug/app-debug.apk
      
